services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - chainwatch_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/chainwatch.db
      - VECTOR_DB_PATH=/data/chainwatch_vectors.db
      # Cross-service URLs (override any localhost values from .env)
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - phoenix
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - chainwatch_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/chainwatch.db
      - VECTOR_DB_PATH=/data/chainwatch_vectors.db
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    depends_on:
      - api
    restart: unless-stopped

  # Arize Phoenix — self-hosted trace collector + UI (http://localhost:6006).
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI + HTTP OTLP
      - "4317:4317"   # gRPC OTLP
    restart: unless-stopped

  # Self-hosted Gemma for reranking + the faithfulness judge.
  # First run: `docker compose exec ollama ollama pull gemma3:4b`
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # Uncomment to use PostgreSQL in production instead of SQLite. RAG keeps its own
  # sqlite-vec file via VECTOR_DB_PATH, so retrieval works either way.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: chainwatch
  #     POSTGRES_PASSWORD: chainwatch
  #     POSTGRES_DB: chainwatch
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  chainwatch_data:
  ollama_models:
  # postgres_data:
