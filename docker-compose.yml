version: "3.9"

services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - chainwatch_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/chainwatch.db
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  # Uncomment below to use PostgreSQL in production instead of SQLite
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: chainwatch
  #     POSTGRES_PASSWORD: chainwatch
  #     POSTGRES_DB: chainwatch
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  chainwatch_data:
  # postgres_data:
